<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Confirm cleaning details · Cleaning.direct</title>
  <style>
    :root{color-scheme:light;--green:#24483d;--ink:#162019;--cream:#f5f2ea;--line:#dcd7c9;--muted:#68716b;--warn:#fff4d9}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:26px 16px 60px}.brand{font-size:23px;font-weight:850;color:var(--green);margin:6px 0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #00000009;margin-bottom:16px}h1{font-size:28px;line-height:1.15;margin:0 0 10px}h2{font-size:19px;margin:25px 0 9px}p{line-height:1.55}.muted{color:var(--muted)}.note{background:var(--warn);border-radius:11px;padding:13px 14px;line-height:1.5}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.summary div{background:#f7f7f4;border-radius:10px;padding:10px}.summary small{display:block;color:var(--muted);margin-bottom:3px}.field{margin:15px 0}.field label,.legend{display:block;font-weight:750;margin-bottom:7px}.field input[type=text],.field textarea,.field select{width:100%;border:1px solid #c9c8c0;border-radius:9px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:92px;resize:vertical}.choice{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.choice input{margin-top:4px}.conditional{margin-left:25px}.hidden{display:none}.confirm{display:flex;gap:10px;align-items:flex-start;margin:22px 0}.confirm input{margin-top:5px}.button{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:14px 16px;font-size:16px;font-weight:850;cursor:pointer}.button:disabled{opacity:.55;cursor:not-allowed}.error{background:#fff0ef;border:1px solid #efc3be;border-radius:10px;padding:12px;margin:14px 0}.success{background:#e5f4e9;border-radius:10px;padding:15px;line-height:1.5}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;margin-right:7px;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:580px){.summary{grid-template-columns:1fr}.card{padding:18px}h1{font-size:25px}}
  </style>
</head>
<body><main class="wrap"><div class="brand">cleaning.direct</div><div id="app"><section class="card"><h1>Loading secure check…</h1></section></div></main>
<script>
(()=>{
  const API='https://fdnnvihxjyzfzbvakdqf.supabase.co/functions/v1/customer-assignment-requirements';
  const app=document.getElementById('app');
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const token=(hash.get('token')||'').trim();
  if(token) history.replaceState(null,'',location.pathname);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api=async payload=>{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({...payload,token})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){const e=new Error(d.error||'request_failed');e.code=d.error||'request_failed';throw e}return d};
  const fail=()=>{app.innerHTML='<section class="card"><h1>Link unavailable</h1><p>This secure link is invalid, expired or has already been completed. If you still need to update your cleaning details, contact Cleaning.direct support.</p></section>'};
  if(!/^[a-f0-9]{64}$/i.test(token)){fail();return}
  const details=(label,id)=>`<div class="field conditional hidden" id="${id}Wrap"><label for="${id}">${label}</label><textarea id="${id}" maxlength="1500"></textarea></div>`;
  api({action:'load'}).then(d=>{
    const b=d.booking;
    app.innerHTML=`<section class="card"><h1>Confirm the job & safety details</h1><p class="muted">Before we can offer this clean to a cleaner, we need the household's assignment and safety information.</p><div class="summary"><div><small>Reference</small><strong>${esc(b.reference)}</strong></div><div><small>When</small><strong>${esc(b.scheduledDate)} at ${esc(b.scheduledTime)}</strong></div><div><small>Area</small><strong>${esc(b.city)} · ${esc(b.postcode)}</strong></div><div><small>Expected duration</small><strong>${esc(b.durationHours)} hours</strong></div></div><div class="note"><strong>Do not put key-safe codes, alarm codes or other access secrets here.</strong> Those should only be shared through the protected access process.</div></section>
    <section class="card"><form id="f"><div class="field"><label for="customerName">Your full name</label><input id="customerName" type="text" maxlength="160" required value="${esc(d.customerName)}"></div>
    <h2>Known health & safety risks</h2><div class="choice"><input type="radio" name="risk" id="riskNone" value="none_reported" required><label for="riskNone">To the best of my knowledge, there are no specific property or work hazards Cleaning.direct needs to tell the cleaner about.</label></div><div class="choice"><input type="radio" name="risk" id="riskYes" value="risks_reported"><label for="riskYes">There are known hazards or safety issues to disclose.</label></div>
    <div id="riskDetails" class="conditional hidden"><div class="field"><label for="risks">Describe the known risks</label><textarea id="risks" maxlength="3000" placeholder="For example: loose stair rail, aggressive pet, restricted area, known chemical sensitivity…"></textarea></div><div class="field"><label for="controls">What controls or precautions should be followed?</label><textarea id="controls" maxlength="3000" placeholder="For example: keep pet in another room, avoid a damaged step, use only specified products…"></textarea></div></div>
    <h2>Additional hirer requirements</h2><div class="field"><label for="experienceMode">Experience</label><select id="experienceMode" required><option value="">Choose…</option><option value="none_additional">No additional experience requirement</option><option value="required">I require specific experience</option></select></div>${details('Describe the required experience','experience')}
    <div class="field"><label for="trainingMode">Training</label><select id="trainingMode" required><option value="">Choose…</option><option value="none_additional">No additional training requirement</option><option value="required">I require specific training</option></select></div>${details('Describe the required training','training')}
    <div class="field"><label for="qualificationMode">Qualifications / authorisations</label><select id="qualificationMode" required><option value="">Choose…</option><option value="none_additional">No additional qualification requirement</option><option value="required">I require a specific qualification or authorisation</option></select></div>${details('Describe the required qualification or authorisation','qualification')}
    <div class="field"><label for="expensesMode">Cleaner expenses for this assignment</label><select id="expensesMode" required><option value="">Choose…</option><option value="none">No customer-funded/reimbursable expense</option><option value="reimbursable">A specific expense should be reimbursed</option></select></div>${details('Describe the expense and what will be reimbursed','expenses')}
    <label class="confirm"><input id="confirm" type="checkbox" required><span>I confirm this information is accurate to the best of my knowledge. I will tell Cleaning.direct if anything changes before the service.</span></label><div id="msg"></div><button id="submit" class="button" type="submit">Confirm job & safety information</button></form></section>`;
    const toggle=(selectId,wrapId,value='required')=>{const s=document.getElementById(selectId),w=document.getElementById(wrapId+'Wrap'),input=document.getElementById(wrapId);const run=()=>{const on=s.value===value;w.classList.toggle('hidden',!on);input.required=on};s.addEventListener('change',run);run()};
    toggle('experienceMode','experience');toggle('trainingMode','training');toggle('qualificationMode','qualification');toggle('expensesMode','expenses','reimbursable');
    const risks=document.querySelectorAll('input[name=risk]'),riskDetails=document.getElementById('riskDetails'),riskText=document.getElementById('risks'),controls=document.getElementById('controls');const riskToggle=()=>{const yes=document.getElementById('riskYes').checked;riskDetails.classList.toggle('hidden',!yes);riskText.required=yes;controls.required=yes};risks.forEach(x=>x.addEventListener('change',riskToggle));
    document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('msg');msg.innerHTML='';btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Saving…';try{const risk=document.querySelector('input[name=risk]:checked')?.value||'';const saved=await api({action:'submit',customerName:document.getElementById('customerName').value,healthSafetyState:risk,knownHealthSafetyRisks:riskText.value,healthSafetyControls:controls.value,experienceMode:document.getElementById('experienceMode').value,requiredExperience:document.getElementById('experience').value,trainingMode:document.getElementById('trainingMode').value,requiredTraining:document.getElementById('training').value,qualificationMode:document.getElementById('qualificationMode').value,requiredQualifications:document.getElementById('qualification').value,expensesMode:document.getElementById('expensesMode').value,expenseDetails:document.getElementById('expenses').value,confirmationAccepted:document.getElementById('confirm').checked});app.innerHTML=`<section class="card"><h1>Confirmed</h1><div class="success">Thanks. The assignment and safety information for <strong>${esc(saved.bookingReference)}</strong> has been recorded. Cleaning.direct can now use it when checking and offering the job to eligible cleaners.</div><p>If anything changes before the clean, contact support so the cleaner receives the updated information.</p></section>`}catch(err){const friendly={risk_details_and_controls_required:'Describe both the risk and the precaution to follow.',requirements_choices_incomplete:'Complete each requirements choice.',explicit_confirmation_required:'Tick the confirmation box before submitting.',requirements_link_not_available:'This link is no longer available.',requirements_no_longer_editable:'A cleaner offer has already started, so these details must now be changed through support.'};msg.innerHTML=`<div class="error">${esc(friendly[err.code]||'We could not save this information. Check the form and try again.')}</div>`;btn.disabled=false;btn.textContent='Confirm job & safety information'}});
  }).catch(fail);
})();
</script></body></html>
