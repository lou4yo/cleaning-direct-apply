name: Legacy Pages first-party-only intake guard
on:
  pull_request:
    paths:
      - 'index.html'
      - 'account/index.html'
      - 'assignment-requirements/index.html'
      - 'legal-pack/index.html'
      - 'rtw/index.html'
      - 'quote/**'
      - 'areas/index.html'
      - 'guides/surrey-domestic-cleaning-prices/index.html'
      - 'sitemap.xml'
      - 'tests/test_quote_contract.mjs'
      - '.github/workflows/quote-fallback-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_quote_contract.mjs
